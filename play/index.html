<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOOPHOLE">
<meta name="description" content="Never lift your thumb. Draw the wire, close the loop, capture the swarm.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>LOOPHOLE</title>
<style>
:root{--bg:#06060e;--fg:#e8f0ff;--dim:#8d96bd;--cyan:#3ef0ff;--pink:#ff3fa4;--gold:#ffd23f;--green:#4dff9a;--purple:#b06bff;--red:#ff4a5a;--panel:rgba(12,14,32,.94);--line:rgba(120,160,255,.28);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;position:fixed;inset:0}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
/* r5 #5: low-HP red vignette and lift dim as compositor layers over the arena only (were full-screen canvas upscales every frame) */
.vig{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;will-change:opacity;z-index:1}
#vigR{background:radial-gradient(ellipse 71.1% 71.1% at 50% 50%,rgba(255,0,32,0) 33%,rgba(255,0,32,.8) 100%)}
#vigD{background:radial-gradient(ellipse 71.1% 71.1% at 50% 50%,rgba(0,0,0,0) 33%,rgba(0,0,0,.87) 100%),rgba(0,0,0,.6)}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;pointer-events:auto;display:flex;flex-direction:column;align-items:center;
padding:calc(14px + var(--sat)) calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scr.dim{background:rgba(4,4,12,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scr.dark{background:radial-gradient(ellipse at 50% 30%,rgba(30,20,70,.55),rgba(4,4,12,.9))}
.col{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:stretch;margin:auto 0}
.grow{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:12px 16px;margin:6px 0;border:1.5px solid var(--line);
background:linear-gradient(180deg,rgba(40,50,110,.55),rgba(14,16,40,.85));color:var(--fg);font:800 17px/1.1 inherit;font-family:inherit;letter-spacing:2px;border-radius:14px;
text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .15s,border-color .15s;outline:none}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.card:focus-visible,.char:focus-visible,.chip:focus-visible,.pal:focus-visible,button.goal:focus-visible,button.pill2:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}   /* r5 #31 */
.btn.primary{border-color:var(--cyan);box-shadow:0 0 18px rgba(62,240,255,.35),inset 0 0 14px rgba(62,240,255,.15);font-size:20px;min-height:60px}
.btn.gold{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.35),inset 0 0 14px rgba(255,210,63,.12)}
.btn.small{min-height:48px;font-size:14px;letter-spacing:1px;padding:10px 12px}
.btn.sel,.card.sel,.char.sel{border-color:#fff!important;box-shadow:0 0 0 2px rgba(255,255,255,.65),0 0 22px rgba(62,240,255,.5)!important}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;width:100%}
.row>.btn{flex:1}
.logo{position:relative;font-size:clamp(46px,14vw,92px);font-weight:900;letter-spacing:clamp(2px,1vw,8px);color:#fff;text-align:center;line-height:1;
text-shadow:0 0 6px var(--cyan),0 0 20px var(--cyan),0 0 42px var(--pink)}
/* r5 #41: the glow pulse is an opacity animation on a pre-glowed copy (compositor only), not an animated text-shadow (repaint every frame) */
.logo::after{content:'LOOPHOLE';position:absolute;left:0;right:0;top:0;color:transparent;text-shadow:0 0 8px var(--cyan),0 0 28px var(--pink),0 0 60px var(--pink);opacity:0;animation:logo 3s ease-in-out infinite;will-change:opacity;pointer-events:none}
@keyframes logo{50%{opacity:1}}
.tag{color:var(--dim);text-align:center;font-size:14px;margin:10px 0 18px;line-height:1.4}
h2{font-size:26px;letter-spacing:3px;text-align:center;margin:6px 0 12px;font-weight:900;text-shadow:0 0 14px rgba(62,240,255,.6)}
.sub{color:var(--dim);font-size:13px;text-align:center;line-height:1.4}
.shards{color:var(--gold);font-weight:900;text-shadow:0 0 10px rgba(255,210,63,.5)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:1px;border:1px solid currentColor}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;margin-bottom:6px}
.topbtn{min-height:48px;min-width:48px;width:auto;margin:0;padding:8px 14px;font-size:14px}
/* cards */
.cards{display:flex;flex-direction:column;gap:10px;width:100%;perspective:900px}
@media (min-aspect-ratio:1/1) and (min-width:700px){.cards{flex-direction:row}.cards .card{flex:1;flex-direction:column;text-align:center}.cards .card .ic{margin:0 auto 6px}}
.card{display:flex;align-items:center;gap:12px;border-radius:16px;border:2px solid #9fb3d9;padding:12px;background:var(--panel);cursor:pointer;min-height:84px;touch-action:manipulation;
opacity:0;animation:flip .38s cubic-bezier(.2,1.4,.4,1) forwards;color:var(--fg);text-align:left;font-family:inherit}
@keyframes flip{0%{opacity:0;transform:rotateY(90deg) scale(.9)}100%{opacity:1;transform:none}}
.card .ic{flex:0 0 52px;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.card .nm{font-weight:900;font-size:17px;letter-spacing:1px}
.card .lv{font-size:12px;color:var(--dim);font-weight:700;margin:2px 0}
.card .ds{font-size:13px;line-height:1.3;color:#cfd8f6}
.card .rar{font-size:11px;font-weight:900;letter-spacing:2px}
.r-common{border-color:#8fa3cc}.r-common .rar{color:#8fa3cc}
.r-rare{border-color:#3ea8ff;box-shadow:0 0 14px rgba(62,168,255,.35)}.r-rare .rar{color:#3ea8ff}
.r-epic{border-color:#c35bff;box-shadow:0 0 20px rgba(195,91,255,.45)}.r-epic .rar{color:#d07bff}
.r-legendary{border-color:var(--gold);box-shadow:0 0 28px rgba(255,210,63,.6);background:linear-gradient(160deg,rgba(70,55,10,.92),rgba(14,14,30,.95))}.r-legendary .rar{color:var(--gold)}
.keyh{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}
/* chars */
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.char{border:2px solid var(--line);border-radius:16px;padding:12px 10px;background:var(--panel);cursor:pointer;text-align:center;touch-action:manipulation;color:var(--fg);font-family:inherit;min-height:150px}
.char .face{width:48px;height:48px;margin:0 auto 6px;border-radius:50%}
.char .nm{font-weight:900;font-size:17px;letter-spacing:2px}
.char .ds{font-size:12px;color:var(--dim);line-height:1.3;margin-top:4px}
.char.locked .face,.char.locked .nm{opacity:.6}   /* r5 #37: dim the icon and name only; descriptions keep 4.5:1 */
.item.locked .ic,.item.locked .nm{opacity:.6}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
/* lists */
.list{display:flex;flex-direction:column;gap:8px;width:100%}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);min-height:60px}
.item .ic{flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.05)}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:900;letter-spacing:1px;font-size:15px}
.item .ds{font-size:12px;color:var(--dim);line-height:1.3}
.item .buy{flex:0 0 auto;width:auto;min-width:84px;margin:0;font-size:14px;min-height:48px;padding:8px 10px}
.item.done{border-color:rgba(77,255,154,.5)}
.wssw{display:block;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}.wshd{font-size:12px;letter-spacing:2px;color:var(--dim);margin:6px 2px 0;font-weight:800}.wsbtn{flex-direction:column;gap:2px;margin:0 0 8px}
.pips{display:flex;gap:3px;margin-top:4px}.pips i{width:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.flashbuy{animation:fb .5s}@keyframes fb{0%{background:rgba(255,210,63,.55);transform:scale(1.04)}100%{background:var(--panel);transform:none}}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);margin:6px 0;min-height:56px;font-weight:800;letter-spacing:1px}
.set input[type=range]{width:55%;height:44px;accent-color:var(--cyan);touch-action:pan-x}
.tog{min-width:84px;width:auto;margin:0;min-height:44px;font-size:14px}
.set .btn{margin:0}.set .tog{min-height:44px;font-size:14px}   /* beats .btn.primary (ON toggles were 60px tall) */
/* r5: on/off toggles two per row so RESET stays above the fold at 360x640 with the GRAPHICS and FLASHES rows */
.setg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.setg .set{flex-direction:column;align-items:stretch;justify-content:center;gap:6px;margin:0;padding:8px 10px;font-size:13px;text-align:center}
.setg .set .tog{width:100%;min-width:0}.setg .set .sub{display:inline;font-size:11px}
/* summary */
.sumhead{font-size:clamp(34px,10vw,56px);font-weight:900;letter-spacing:3px;text-align:center;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:11px;color:var(--dim);letter-spacing:1.5px;font-weight:800}
.near{color:#ffb35c;font-size:14px;font-weight:700;text-align:center;margin:3px 0;line-height:1.35}
.dmgrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.dmgrow .b{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.dmgrow .b i{display:block;height:100%;border-radius:6px}
.dmgrow .v{width:56px;text-align:right;color:var(--dim)}
.stamp{position:relative;display:block;width:max-content;margin:10px auto 0;transform:rotate(-4deg);border:4px solid var(--gold);color:var(--gold);font-weight:900;font-size:22px;padding:6px 10px;border-radius:10px;
letter-spacing:2px;text-shadow:0 0 12px rgba(255,210,63,.8);box-shadow:0 0 18px rgba(255,210,63,.5);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both .7s;pointer-events:none;background:rgba(20,16,0,.7)}
@keyframes stamp{0%{opacity:0;transform:rotate(-4deg) scale(3)}100%{opacity:1;transform:rotate(-4deg) scale(1)}}
.retry{font-size:26px;min-height:74px;letter-spacing:5px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(62,240,255,.7),inset 0 0 18px rgba(62,240,255,.25)}}
.conf{position:fixed;top:-20px;width:8px;height:14px;pointer-events:none;z-index:5;animation:conf linear forwards}
@keyframes conf{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg)}}
.build{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.bi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);position:relative}
.bi em{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-size:11px;font-weight:900;background:#000;border-radius:6px;padding:0 3px;border:1px solid var(--line)}
.bi.evo{border-color:var(--gold);box-shadow:0 0 10px rgba(255,210,63,.5)}
/* chest */
.reels{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.reel{width:60px;height:72px;border-radius:12px;border:2px solid var(--gold);background:#0b0b1c;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 16px rgba(0,0,0,.8),0 0 12px rgba(255,210,63,.3)}
.reel.stop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.18)}}
.jack{font-size:clamp(36px,10.5vw,58px);font-weight:900;color:var(--gold);text-align:center;text-shadow:0 0 16px var(--gold),0 0 30px var(--pink);animation:jpop .5s infinite;width:max-content;max-width:100%;margin:0 auto}@keyframes jpop{50%{transform:scale(1.08)}}
/* hud dom */
#pb{position:fixed;top:calc(8px + var(--sat));right:calc(8px + var(--sar));width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,12,30,.6);
color:#fff;font-size:18px;font-weight:900;z-index:3;display:none;touch-action:manipulation;cursor:pointer;align-items:center;justify-content:center}
body[data-state=run] #pb,body[data-state=liftpause] #pb{display:flex}
#toast{position:fixed;left:50%;top:calc(58px + var(--sat));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:linear-gradient(90deg,rgba(60,45,0,.92),rgba(20,16,40,.92));border:1.5px solid var(--gold);border-radius:12px;padding:5px 12px;font-weight:800;font-size:13px;
box-shadow:0 0 18px rgba(255,210,63,.4);animation:tin 2.8s forwards;text-align:center;width:100%}
.toast small{display:block;color:#ffe9a8;font-weight:600;font-size:12px}
@keyframes tin{0%{opacity:0;transform:translateY(-14px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.tabs{color:var(--dim);font-size:12px;text-align:center;margin-top:10px;line-height:1.5}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px;font-weight:700}
svg.i{display:block}
.spips{display:flex;gap:3px;justify-content:center;margin-top:6px}.spips i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.14);transform:rotate(45deg)}.spips i.on{background:#ff4dff;box-shadow:0 0 6px #ff4dff}
.stakebar{display:flex;align-items:center;gap:8px;margin-top:10px}.stakebar .sk{flex:1;min-width:0;text-align:center}.stakebar .sk b{display:block;font-size:15px;color:#ff9aff;letter-spacing:1px}.stakebar .sk span{display:block;font-size:11px;color:var(--dim);line-height:1.3}
.palrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:11px;font-weight:900;letter-spacing:2px;color:var(--dim)}
.pal{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);cursor:pointer}.pal.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
.tip{font-size:15px;font-weight:700;text-align:center;color:#ffd0d6;margin:6px 4px 2px;line-height:1.35}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 2px}
button.pill2,button.goal{font-family:inherit;cursor:pointer;touch-action:manipulation}button.goal{display:block;width:100%;color:var(--fg);font-size:inherit}
.nextrun{display:flex;align-items:center;gap:6px;width:100%;margin:4px 0 0}.nextrun .lab{font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--dim);white-space:nowrap}
.nextrun .btn{flex:1;min-height:40px;font-size:11px;letter-spacing:.5px;padding:4px 6px;margin:0;line-height:1.1}.nrd{font-size:11px;color:#cfd8f6;text-align:center;margin:2px 0 0;min-height:14px}
.pill2{background:linear-gradient(180deg,rgba(90,70,0,.95),rgba(40,30,0,.95));border:1.5px solid var(--gold);color:#ffe9a8;border-radius:99px;padding:5px 12px;font-weight:900;font-size:12px;letter-spacing:1px;box-shadow:0 0 12px rgba(255,210,63,.45);animation:pillin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pillin{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:none}}
.bsub{display:block;font-size:11px;letter-spacing:.5px;color:var(--gold);font-weight:800;margin-top:2px;text-transform:none}
.evoline{font-size:11px;font-weight:800;color:#c9b6ff;margin-top:3px}.evoline.hot{color:var(--gold)}
#rot{display:none;position:fixed;inset:0;z-index:10;background:#06060e;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:20px;letter-spacing:2px;pointer-events:auto}
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){#rot{display:flex}}
.r-legendary{position:relative;overflow:hidden}
.r-legendary::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,180,.38) 50%,transparent 70%);transform:translateX(-120%);animation:shim 1.7s ease-in-out .5s infinite;pointer-events:none}
@keyframes shim{to{transform:translateX(120%)}}
@media (pointer:coarse){.keyh{display:none}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);display:inline-block;flex:0 0 9px}
.pinbar{position:fixed;left:0;right:0;bottom:0;padding:10px calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal));display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,rgba(6,6,14,0),rgba(6,6,14,.94) 30%);touch-action:none;pointer-events:auto}
.retry,.pinbar .btn{touch-action:none}
.pinbar .more{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;letter-spacing:2px;color:#cfd8f6;background:rgba(20,24,60,.96);border:1px solid var(--line);border-radius:99px;padding:3px 12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.pinbar.hasmore .more{opacity:1}
.goal{background:var(--panel);border:1.5px solid rgba(255,210,63,.45);border-radius:14px;padding:10px 12px;margin:14px 0 4px;text-align:left}
.goal .gl{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--gold)}
.goal .gn{font-weight:900;font-size:16px;margin-top:2px}.goal .gn span{font-weight:600;font-size:12px;color:var(--dim)}
.goal .gp{font-size:11px;color:var(--dim);margin-top:4px;text-align:right}
.ttop{margin-top:6vh}
.scr.opaque{background:radial-gradient(ellipse at 50% 30%,#1a1240,#06060e 75%)}
.again .stamp,.again .pill2{animation:none}
@media (prefers-reduced-motion:reduce){.logo,.logo::after,.pill2,.stamp,.retry,.jack{animation:none}.r-legendary::after{animation:none;display:none}}
@media (max-height:700px){.goal+.goal{display:none}.logo{font-size:clamp(40px,12vw,80px)}.ttop{margin-top:2vh}.tag{margin:6px 0 10px}.set{min-height:48px;margin:4px 0;padding:8px 12px}
.pinbar .row .btn{min-height:44px;margin:3px 0}.retry{min-height:62px;font-size:23px}.stats{gap:6px;margin:8px 0}.stat{padding:5px 4px}.stat b{font-size:19px}.stat span{letter-spacing:.5px}.sumhead{font-size:clamp(30px,9vw,48px)}}
.chip{display:inline-flex;align-self:center;align-items:center;gap:8px;min-height:44px;padding:8px 14px;margin:2px auto 6px;border-radius:99px;border:1.5px solid var(--line);background:rgba(20,24,60,.7);color:var(--fg);font:800 13px/1 inherit;font-family:inherit;letter-spacing:1px;cursor:pointer;touch-action:manipulation}
.near.big{font-size:22px;color:#ffd23f;font-weight:900;margin:6px 0}
.knotbar{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;color:#ffb0ff;letter-spacing:1px;margin:6px 0}.knotbar .bar{flex:1;margin:0}.knotbar .bar i{background:#ff4dff}

// read or wrote (its sync base); writes merge with anything another tab stored since, and a 'storage' event re-syncs.

// Unchanged here -> theirs; unchanged there -> mine; both changed: counters add their deltas, records take the max,

  if(Q.trial){const T=Q.trial;T.acc+=dt;T.n++;if(spike)T.spk++;if(T.acc>=T.len){const after=T.acc/T.n;Q.trial=null;
      if(T.spiky?(T.spk>1||after>T.before*1.05):after>T.before*0.9){Q.low=false;Q.capped=true;save.settings.qa=2;console.info('LOOPHOLE: auto-quality -> low did not help, back to high');}else save.settings.qa=1;
      Q.pendLayout=Q.pendLayout||L.DPR!==(Q.low?1:Math.min(2,window.devicePixelRatio||1));}return;}
  if(Q.low)return;
  const goLow=spiky=>{Q.low=true;Q.pendLayout=true;Q.trial={acc:0,n:0,spk:0,spiky,len:spiky?6:2,before:Q.hsum/Math.max(1,Q.hist.length)};console.info('LOOPHOLE: auto-quality -> low (trial'+(spiky?', long frames':'')+')');};
  if(Q.spk>=4){Q.spk=0;goLow(true);return;}
  Q.acc+=dt;Q.n++;if(Q.acc>=0.5){const avg=Q.acc/Q.n;Q.acc=0;Q.n=0;if(avg>0.024){Q.bad++;if(Q.bad>=2)goLow(false);}else Q.bad=0;}}
// r7 perf: effect budget (see fxN): every frame over 50 ms of live play thins the next bursts (x0.75, floor 0.4); +0.1/s back to 1.
// Runs in every graphics mode (HIGH included): it only trims particle counts while the device is visibly struggling.
function fxTick(dt,raw){if(state==='run'){Q.runT+=dt;if(dt>=0.05&&raw<0.25&&Q.runT>0.5)Q.fxK=Math.max(0.4,Q.fxK*0.75);else Q.fxK=Math.min(1,Q.fxK+0.1*dt);}else Q.runT=0;}
function frame(){requestAnimationFrame(frame);try{const t=nowMs();let dt=(t-lastT)/1000;lastT=t;const raw=dt;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  autoQuality(dt,raw);fxTick(dt,raw);Q.fdt+=(Math.min(raw,0.05)-Q.fdt)*0.05;hiHz=Q.fdt<0.0125;if(Q.pendLayout&&state!=='run'){Q.pendLayout=false;layout();}pollPend();
  if(state!=='run'&&state!=='liftpause'&&state!=='levelup'&&state!=='chest'&&nowMs()-lastInputT>5000&&A.on())A.suspend();   /* r5 #41: idle menus let the audio engine sleep (the next tap wakes it) */
  if(testAuto)advance(dt);uiTick(dt);realFx(dt);render(dt);audioFrame(dt);}
  catch(err){console.error('LOOPHOLE frame error:',err);}}

/* ---------------- boot ---------------- */
layout();showTitle();requestAnimationFrame(frame);
if(!TEST){try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.isSecureContext&&window.self===window.top){navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='lh-updated'){updReady=true;updToast();}});navigator.serviceWorker.register('sw.js').catch(()=>{});}}catch(e){}}

/* ---------------- test hooks (?test=1) ---------------- */
if(TEST){const stepF=n=>{for(let i=0;i<n;i++){advance(1/60);uiTick(1/60);realFx(1/60);}return state;};
  window.__lh={
    state:()=>state,
    r8:{rng:sd=>mulberry32(sd>>>0),crystals:()=>xtalN,dailyMod(id){testDailyMod=id||null;},count(name){const f=SFX[name];let n=0;SFX[name]=function(){n++;return f.apply(this,arguments);};return()=>n;}},   // r8 test hooks
    seed(n){pendingSeed=n>>>0;return true;},
    startRun(wire,opts){startRun(wire||'copper',opts||{});return state;},
    step:stepF,
    touch(x,y,phase){phase=phase||'move';if(phase==='start'){TEST_DIRECT.on=true;TEST_DIRECT.x=x;TEST_DIRECT.y=y;IN.down=true;IN.id=-99;touchStart();TEST_DIRECT.on=true;}
      else if(phase==='end'){IN.down=false;IN.id=-1;touchEnd();TEST_DIRECT.on=false;}else{TEST_DIRECT.x=x;TEST_DIRECT.y=y;}return state;},
    drawPath(pts,opts){opts=opts||{};if(!R)return null;const l0=R.loops,c0=R.captures;const per=opts.per||1;const p0=pts[0];
      window.__lh.touch(p0[0],p0[1],'start');let g=0;while(R.dashing&&g++<240)stepF(1);
      for(let i=1;i<pts.length;i++){TEST_DIRECT.x=pts[i][0];TEST_DIRECT.y=pts[i][1];stepF(per);if(state!=='run')break;if(opts.stopOnLoop&&R.loops>l0)break;}
      if(opts.lift!==false&&state==='run')window.__lh.touch(0,0,'end');
      return{loops:R.loops-l0,captured:R.captures-c0,last:R.lastCapture,state};},
    spawn(type,x,y){if(!R)return false;const t=typeof type==='number'?type:ET_BY[type];if(t===undefined)return false;const e=spawnE(t,x,y);return !!e;},
    setTime(s){if(!R)return;R.time=s;R.clockOn=true;while(R.nextElite<=s)R.nextElite+=45;while(R.herdI<R.herds.length&&R.herds[R.herdI]<=s)R.herdI++;R.snipDone=true;},
    god(b){GOD=!!b;return GOD;},
    get lastCapture(){return R?R.lastCapture:null;},
    get game(){return R;},
    enemies(){return aliveCount();},
    clear(){for(let i=0;i<nE;i++){E[i].alive=false;E[i].dying=0;}nE=0;nB=0;},
    pick(i){if(state==='levelup'){uiLock=0;pickCard(i||0);}return state;},
    chest(n){if(R&&R.started&&(state==='run'||state==='liftpause')){openChest(n);}return state;},
    xp(n){if(R)gainXP(n);return R?R.pendingLv:0;},
    bolt(x,y,vx,vy,kind){if(R)fireBolt(x,y,vx,vy,kind?10:LOB_BOLT_DMG,kind?1:0);},
    goals:()=>nextGoals(3),
    offer:()=>curCards.map(c=>c.kind==='card'?c.id:c.kind),
    ents(){const o=[];for(let i=0;i<nE;i++){const e=E[i];if(e.alive)o.push({type:e.type,tagT:e.tagT,x:e.x,y:e.y,elite:!!e.elite,maxHp:e.maxHp});}return o;},
    summary:()=>lastSummary,
    quality(){return{low:Q.low,force:Q.force,dpr:L.DPR,ss:SS,fxK:Q.fxK,spk:Q.spk,trial:Q.trial?{spiky:Q.trial.spiky,len:Q.trial.len}:null,capped:Q.capped,fdt:Q.fdt,hiHz,atl:atlDone};},
    fx(){let p=0;for(const q of POP)if(q.on&&q.life>0)p++;let fl=0;for(const f of FLASH)if(f.on&&!f.empty)fl++;return{popups:p,banners:R?R.banners.length:0,deathRT:R?R.deathRT:0,flashes:fl};},
    parts:()=>nP,
    wire(){let thinU=0;for(let i=1;i<wN;i++)if(!WT[i])thinU+=WS[i];return{t:wN?WT[wN-1]:1,thinU:Math.round(thinU),n:wN,len:wLen,x0:wN?WX[0]:0,y0:wN?WY[0]:0,hx:wN?WX[wN-1]:0,hy:wN?WY[wN-1]:0,frozen:R?!!R.frozenWire:false,drawing:R?R.drawing:false,dashing:R?R.dashing:false};},
    hash(){if(!R)return '';const g=R,parts=[g.time.toFixed(3),g.core.x.toFixed(2),g.core.y.toFixed(2),g.core.hp,g.kills,g.captures,g.score,g.level,g.xp.toFixed(3),nE,nC,wN,g.loops,g.cuts];
      for(let i=0;i<nE;i++){const e=E[i];if(e.alive)parts.push(e.type+':'+e.x.toFixed(2)+','+e.y.toFixed(2)+','+e.hp.toFixed(2));}
      for(let i=0;i<nC;i++){parts.push(CR[i].x.toFixed(2)+','+CR[i].y.toFixed(2));}
      const str=parts.join('|');let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16)+':'+str.length;},
    shareText:()=>shareText(),
    collect(){if(state==='chest'&&chestS){chestS.t=2;chestTick(0.01);uiLock=0;collectChest();}return state;},
    retry(){uiLock=0;act('retry');return state;},
    resume(){uiLock=0;act('resume');return state;},
    auto(b){testAuto=!!b;},
    boss(){return R&&R.boss?{alive:R.boss.alive,hp:R.boss.hp,max:R.boss.max,x:R.boss.x,y:R.boss.y,phase:R.boss.phase,enter:R.boss.enter,st:R.boss.st,stag:R.boss.stag||0,stagI:R.boss.stagI||0}:null;},
    arena(){return{w:AW,h:L.AH,S:L.S,ax:L.AX0,ay:L.AY0,stripY:L.stripY};},
    pops(){const o=[];for(const p of POP)if(p.on&&p.life>0)o.push({t:p.txt,y:Math.round(w2sy(p.y)),h:Math.round(p.size*L.S*0.75)});return o;},
    banners(){return R?{y:R.banY,h:R.banH||0,list:R.banners.map(b=>b.t)}:null;},
    audio:()=>({A,SFX,Music,Hum,audioFrame,ACAT,VCAPS,AQ,aqDrain}),
    save:()=>save,
  };}
})();
