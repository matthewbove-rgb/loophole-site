<html lang="en">
<head>
<meta charset="utf-8">

<title>LOOPHOLE has moved</title>
<meta http-equiv="refresh" content="0; url=https://matthewbove-rgb.github.io/Loophole-public/">
<link rel="canonical" href="https://matthewbove-rgb.github.io/Loophole-public/">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#06060e;color:#e8f0ff;font:16px system-ui,sans-serif;text-align:center;padding:16px}a{color:#3ef0ff}</style>
</head>
<body>
<p>LOOPHOLE has moved to<br><a href="https://matthewbove-rgb.github.io/Loophole-public/">matthewbove-rgb.github.io/Loophole-public</a></p>
<script>
// retire the old offline copy (the old /play/ service worker) so installed phones stop showing it, then go to the new build
try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}catch(e){}
try{if(window.caches)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).catch(()=>{});}catch(e){}
location.replace('https://matthewbove-rgb.github.io/Loophole-public/');
</script>
</body>
</html>
