}

const RAR=['common','rare','epic','legendary'];
// r5 #25: these effects read the card LEVEL, not its points, so RARE's '+50%' (1.5 pts) would do nothing: they never roll plain RARE

const LV_ONLY={shock:1,implode:1,splice:1,tight:1,twin:1};
function rollRarity(){const r=R.rC()*100;return r<2?3:r<12?2:r<40?1:0;}
function rollCards(){const cards=[];let pool=[];const tutLimit=R.tutCards||R.keepOffer;R.tutCards=false;const keep=!!R.keepOffer;
  for(const c of CARDS){if(lv(c.id)>=c.max)continue;if(c.world&&c.world!==R.world)continue;if(tutLimit&&!keep&&c.id!=='long'&&c.id!=='snap'&&c.id!=='live')continue;pool.push(c.id);}   /* Keepsake: any card, always common */
  const evo=keep?[]:evoEligible();if(evo.length&&R.rC()<0.85){cards.push({kind:'evo',id:evo[Math.floor(R.rC()*evo.length)].id,rar:3});}
  const wt=id=>{const ev=EVOS.find(x=>(x.a===id||x.b===id)&&!R.evos[x.id]);if(ev&&lv(ev.a===id?ev.b:ev.a)>0)return EVO_W_PARTNER;return R.cards[id]?EVO_W_OWNED:1;};
  while(cards.length<3&&pool.length){let sum=0;for(const id of pool)sum+=wt(id);let r=R.rC()*sum,pick=0;for(let i=0;i<pool.length;i++){r-=wt(pool[i]);if(r<=0){pick=i;break;}}
    const id=pool.splice(pick,1)[0];let rar=tutLimit?0:rollRarity();if(rar===1&&LV_ONLY[id])rar=0;cards.push({kind:'card',id,rar});}   // r5 #25
  if(cards.length===0)cards.push({kind:'heal',rar:0},{kind:'shards',rar:1});
  return cards;}
// r11 card readability (first human feedback: 'too hard to track and see the impact of each buff'). Every card states its live numbers:
// cardVals(id) = [label, value] rows for the CURRENT run state; cardPreview() applies a pick on the card table, recalcs, reads, then restores
// (recalc is a pure function of R.cards/shop/wire/mods; the Core's hp/max are put back by hand) — UI only, no RNG, no sim state changes.
const cvP=v=>Math.round(v*100)+'%',cvS=v=>(v<0?'−':'+')+cvP(Math.abs(v)),cvT=v=>(+v.toFixed(2))+'s',cvN=v=>fmtN(Math.round(v));
function cardVals(id){const l=lv(id),p=pts(id),no='—';switch(id){
  case 'long':return [['Wire length',cvN(R.maxLen)]];
  case 'live':return [['Wire shock',cvN(R.liveDmg)+' dmg'],['slow',cvP(R.liveSlow)]];
  case 'snap':return [['Loop damage',cvN(40*R.dmgMult)]];
  case 'shock':return [['Blast',l?cvN(CARD_SHOCK_DMG*l)+' dmg':no]];
  case 'implode':return [['Pull reach',l?cvN(CARD_IMPLODE_R0+CARD_IMPLODE_STEP*l):no]];
  case 'tensile':return [['Thick up to speed',R.thr>=1e8?'always':cvN(R.thr)]];
  case 'after':return [['Outline burn',l?cvN(CARD_AFTER_DPS*Math.max(1,p))+' dmg/s':no]];
  case 'pull':return [['XP',cvS(R.xpMult-1)]];
  case 'chaintime':return [['Chain window',cvT(R.chainWin)]];
  case 'plating':return [['Max HP',cvN(R.core.max)]];
  case 'recovery':return [['Safe after hit',cvT(R.iframes)],['5+ loop heals',l?CARD_RECOVERY_HEAL*l+' HP':no]];
  case 'splice':return [['A cut costs',l?'half the wire':'the whole wire'],['chain',l>=2?'survives cuts':'breaks on a cut']];
  case 'tight':return [['Smallest loop',cvN(R.minArea)],['snap-shut',cvN(R.assist)]];
  case 'twin':return [['Ghost wire',l?cvP(R.twinPct)+' power':no]];
  case 'static':return [['Aura radius',l?cvN(R.staticR):no]];
  case 'crowd':return [['Per extra enemy',cvS(R.cmStep)+' pts']];
  case 'hush':return [['Calm',p?cvT(0.4+0.6*p):no]];
  case 'honey':return [['Honey lasts',p?cvT(0.5+0.5*p):no]];

/* ---------------- main loop ---------------- */
let lastT=nowMs(),testAuto=!TEST;
// Downgrade after ~1 s of slow frames, then TRIAL it for 2 s: if frames did not get >=10% faster (e.g. a 30 Hz display or
// transient load: the JS was never the bottleneck) revert to high and stop auto-downgrading. The DPR rebuild (layout(), a
// visible hitch) waits for the next screen that is not live play.
// r7: also spike-aware: frames over 50 ms (not pauses: raw gap < 250 ms, and not the first 0.5 s back in play) feed a decaying counter
// (tau 8 s); 4 of them start a 6 s trial, kept only if it had at most one long frame and was not slower on average. Same one-way
// trial/cap rules as the average path, so it cannot oscillate.
function autoQuality(dt,raw){if(Q.force||Q.capped||state!=='run')return;const spike=dt>=0.05&&raw<0.25&&Q.runT>0.5;
  Q.hist.push(dt);Q.hsum+=dt;while(Q.hsum>2&&Q.hist.length>1)Q.hsum-=Q.hist.shift();
  Q.spk=Q.spk*Math.exp(-dt/8)+(spike?1:0);
  if(Q.trial){const T=Q.trial;T.acc+=dt;T.n++;if(spike)T.spk++;if(T.acc>=T.len){const after=T.acc/T.n;Q.trial=null;
      if(T.spiky?(T.spk>1||after>T.before*1.05):after>T.before*0.9){Q.low=false;Q.capped=true;save.settings.qa=2;console.info('LOOPHOLE: auto-quality -> low did not help, back to high');}else save.settings.qa=1;
      Q.pendLayout=Q.pendLayout||L.DPR!==(Q.low?1:Math.min(2,window.devicePixelRatio||1));}return;}
  if(Q.low)return;
  const goLow=spiky=>{Q.low=true;Q.pendLayout=true;Q.trial={acc:0,n:0,spk:0,spiky,len:spiky?6:2,before:Q.hsum/Math.max(1,Q.hist.length)};console.info('LOOPHOLE: auto-quality -> low (trial'+(spiky?', long frames':'')+')');};
  if(Q.spk>=4){Q.spk=0;goLow(true);return;}
  Q.acc+=dt;Q.n++;if(Q.acc>=0.5){const avg=Q.acc/Q.n;Q.acc=0;Q.n=0;if(avg>0.024){Q.bad++;if(Q.bad>=2)goLow(false);}else Q.bad=0;}}
// r7 perf: effect budget (see fxN): every frame over 50 ms of live play thins the next bursts (x0.75, floor 0.4); +0.1/s back to 1.
// Runs in every graphics mode (HIGH included): it only trims particle counts while the device is visibly struggling.
function fxTick(dt,raw){if(state==='run'){Q.runT+=dt;if(dt>=0.05&&raw<0.25&&Q.runT>0.5)Q.fxK=Math.max(0.4,Q.fxK*0.75);else Q.fxK=Math.min(1,Q.fxK+0.1*dt);}else Q.runT=0;}
function frame(){requestAnimationFrame(frame);try{const t=nowMs();let dt=(t-lastT)/1000;lastT=t;const raw=dt;if(dt>0.1)dt=0.1;if(dt<0)dt=0;
  autoQuality(dt,raw);fxTick(dt,raw);Q.fdt+=(Math.min(raw,0.05)-Q.fdt)*0.05;hiHz=Q.fdt<0.0125;if(Q.pendLayout&&state!=='run'){Q.pendLayout=false;layout();}pollPend();
  if(state!=='run'&&state!=='liftpause'&&state!=='levelup'&&state!=='chest'&&nowMs()-lastInputT>5000&&A.on())A.suspend();   /* r5 #41: idle menus let the audio engine sleep (the next tap wakes it) */
  if(testAuto)advance(dt);uiTick(dt);realFx(dt);render(dt);audioFrame(dt);}
  catch(err){console.error('LOOPHOLE frame error:',err);}}

/* ---------------- WP-A: World 2 simulation (WORLD2.md §3, §5, §6 cards; DESIGN §22) ----------------
